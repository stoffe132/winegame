name: Build and deploy WineGame

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_REPO: andrewnakas/Boxedwine64
  ROOTFS_RELEASE_TAG: rootfs-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WineGame
        uses: actions/checkout@v4

      - name: Get Boxedwine64 source
        run: git clone --depth 1 https://github.com/${{ env.UPSTREAM_REPO }}.git boxedwine64

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly
        working-directory: boxedwine64/project/emscripten
        run: make wasm64-mt

      - name: Download root filesystem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="boxedwine64/project/emscripten/Build/Wasm64Mt"
          gh release download "${ROOTFS_RELEASE_TAG}"             --repo "${UPSTREAM_REPO}"             --dir "${out}"             --pattern '*.zip'             --pattern '*.zip.part*'             --pattern '*.manifest.json'             --clobber

      - name: Validate patch script
        run: python3 -m py_compile tools/patch_wine64_upload.py

      - name: Add game upload support
        run: python3 tools/patch_wine64_upload.py

      - name: Validate generated launcher
        run: |
          node --check boxedwine64/project/emscripten/Build/Wasm64Mt/wine64-launcher.js
          grep -q "Upload game" boxedwine64/project/emscripten/Build/Wasm64Mt/wine64.html

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          src="boxedwine64/project/emscripten/Build/Wasm64Mt"
          site="_site"
          mkdir -p "${site}"

          cp "${src}/wine64.html" "${site}/"
          cp "${src}/wine64-launcher.js" "${site}/"
          cp "${src}/coi-serviceworker.js" "${site}/"
          cp "${src}/boxedwine.css" "${site}/" 2>/dev/null || true
          cp "${src}/boxedwine64.js" "${site}/"
          cp "${src}/boxedwine64.wasm" "${site}/"
          cp "${src}"/*.zip "${site}/" 2>/dev/null || true
          cp "${src}"/*.zip.part* "${site}/" 2>/dev/null || true
          cp "${src}"/*.manifest.json "${site}/"

          cat > "${site}/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head>
            <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
            <title>WineGame</title>
            <style>
              body{font:16px system-ui,sans-serif;max-width:720px;margin:12vh auto;padding:24px;text-align:center;background:#111;color:#eee}
              button{font:18px system-ui;padding:14px 22px;margin:8px;border-radius:10px;cursor:pointer}
              #status{margin-top:18px;min-height:24px;color:#bbb}
              input{display:none}
            </style>
          </head><body>
            <h1>WineGame</h1>
            <p>Choose a Windows game. The emulator starts after you choose the file.</p>
            <input id="game" type="file" accept=".exe,.zip,application/x-msdownload,application/zip,application/octet-stream">
            <button id="pick">Upload game (.exe / .zip)</button>
            <p><a href="wine64.html?chunked=1&p=notepad.exe" style="color:#aaa">Open emulator without a game</a></p>
            <div id="status"></div>
            <script>
            const input=document.getElementById('game'),status=document.getElementById('status');
            document.getElementById('pick').onclick=()=>input.click();
            input.onchange=async()=>{
              const f=input.files[0]; if(!f)return;
              status.textContent='Preparing '+f.name+'…';
              try{
                const req=indexedDB.open('winegame-upload',1);
                req.onupgradeneeded=()=>req.result.createObjectStore('files');
                req.onsuccess=()=>{
                  const db=req.result,tx=db.transaction('files','readwrite');
                  tx.objectStore('files').put({name:f.name,type:f.type,bytes:f.arrayBuffer()},'pending');
                  tx.oncomplete=()=>location.href='wine64.html?chunked=1&p=notepad.exe&autogame=1';
                };
                req.onerror=()=>{status.textContent='Could not prepare the upload.'};
              }catch(e){status.textContent='Could not prepare the upload: '+e};
            };
            </script>
          </body></html>
          HTML
          touch "${site}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
